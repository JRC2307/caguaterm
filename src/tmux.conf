# ~/.tmux.conf — tuned for the ttyd web terminal (phone-friendly) + local use.
# The "main" session is shared: attach to it locally with `t` (alias in .zshrc)
# and via the browser at http://js-mac-mini.triceratops-adelie.ts.net:7681

# Run an interactive *login* shell in every pane so ~/.zshenv + ~/.zshrc
# (oh-my-zsh, theme, aliases, PATH) are always loaded — even when tmux is
# started from the LaunchAgent's bare environment.
set -g default-command "${SHELL} -l"

# Mouse: tap a window in the status bar to switch, tap a pane to focus,
# drag borders to resize, scroll wheel = scrollback. This is what makes
# "tabs" usable by touch in the browser terminal.
set -g mouse on

# Terminal / colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,*256col*:Tc"

# Big scrollback
set -g history-limit 50000

# Windows ("tabs") start at 1, renumber when one closes, keep manual names
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g allow-rename off
# window name = project dir basename, same label the claude voice hook announces
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# Snappier keys
set -sg escape-time 10
set -g focus-events on

# ---------------------------------------------------------------- status bar
# Each session gets its own accent color (@accent), set by ~/bin/tmux-accent
# from the session name — same Tokyo Night scheme, different accent per
# session so parallel sessions (local, web terminal, ssh from the Air) are
# distinguishable at a glance.
set -g @accent "#7aa2f7"
set-hook -g session-created 'run-shell "~/bin/tmux-accent #{hook_session_name}"'
set -g status on
set -g status-interval 5
set -g status-position top   ;# bottom is taken by the web terminal's key bar
set -g status-style "bg=#16161e,fg=#a9b1d6"
set -g status-left "#[bg=#{@accent},fg=#16161e,bold] #S #[bg=#16161e,fg=#{@accent}]"
set -g status-left-length 24
# Wide clients (>= 100 cols) also show the open ledger for the active pane's project
# (`ledger line`: <= 40 chars, empty when none, no network). Phones keep the short bar
# so the window tabs stay tappable; they get the ledger via prefix L instead.
set -g status-right '#[fg=#565f89]#{?client_prefix,#[fg=#e0af68]^B ,}#{?#{e|>=:#{client_width},100},#[fg=#e0af68]#(cd #{q:pane_current_path} && ~/bin/ledger line | sed -e "s/.$/&  /")#[fg=#565f89],}%a %d %b #[fg=#{@accent}]%H:%M '
set -g status-right-length 64
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[bg=#{@accent},fg=#16161e,bold] #I:#W #[default]"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#{@accent}"

# ------------------------------------------------------------------- keybinds
# prefix is the default Ctrl-b  (needs a physical/Bluetooth keyboard on phone)
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# ledger: prefix L toggles a live `ledger watch` pane on the right (a popup with
# `ledger show` on clients < 100 cols); prefix A opens the agents board. L replaces
# tmux's default `switch-client -l` (last session).
bind L run-shell -b "~/bin/ledger-tmux #{q:pane_current_path} #{client_width} #{window_id} #{q:client_name}"
bind A display-popup -E -w 95% -h 85% -d "#{pane_current_path}" "~/bin/ledger-agents-popup #{q:client_name}"
# jump to window N without the prefix (handy with an external keyboard)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
# macOS terminals without "Option as Meta" (e.g. cmux) send Option+key as a
# composed character instead of M-key — bind those variants too (US layout)
bind -n ¡ select-window -t 1
bind -n ™ select-window -t 2
bind -n £ select-window -t 3
bind -n ¢ select-window -t 4
bind -n ∞ select-window -t 5
bind -n § select-window -t 6
# Alt+c = new window (ç is what macOS sends for Option+c)
bind -n M-c new-window -c "#{pane_current_path}"
bind -n ç new-window -c "#{pane_current_path}"

# OSC 52 clipboard forwarding: let inner TUIs (hermes chat, copy-mode y) push
# copies through tmux -> ttyd -> browser clipboard (handler in keybar snippet)
set -g set-clipboard on
set -g allow-passthrough on
